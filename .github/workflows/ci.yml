name: CI

on:
  - push
  - pull_request

env:
  BUNDLE_PATH: vendor/bundle
  BUN_INSTALL_CACHE_DIR: vendor/bun

jobs:
  scan_ruby:
    name: Scan for Ruby security issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Prepare gem cache
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-
      - name: Set up Ruby
        uses: jdx/mise-action@v3
        with:
          install_args: ruby
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ruby gems
        run: bundle install
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      - name:
          Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    name: Scan for JavaScript security issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Prepare bun cache
        uses: actions/cache@v6
        with:
          path: vendor/bun
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Set up Bun
        uses: jdx/mise-action@v3
        with:
          install_args: bun
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Bun packages
        run: bun install
      - name: Scan for known security vulnerabilities in packages used
        run: bun audit --audit-level high

  check:
    name: Check code issues
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Prepare gem cache
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-
      - name: Prepare Bun cache
        uses: actions/cache@v6
        with:
          path: vendor/bun
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Set up tools
        uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ruby gems
        run: bundle install
      - name: Install Bun packages
        run: bun install
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          # prettier-ignore
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          # prettier-ignore
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Check code issues
        run: mise check --all
        env:
          MISE_VERBOSE: "1"
      - name: Dump hk output log on failure
        if: failure()
        run: |
          echo "=== ~/.local/state/hk/output.log ==="
          cat ~/.local/state/hk/output.log || echo "(no output.log found)"
          echo
          echo "=== dmesg tail (for segfault details) ==="
          sudo dmesg | tail -50 || true
          echo
          echo "=== core dumps ==="
          ls -la /var/lib/systemd/coredump/ 2>/dev/null || true
          ls -la core* 2>/dev/null || true

  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgis://supabase_admin:postgres@localhost:5432
    services:
      postgres:
        image: supabase/postgres:17.6.1.016
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options:
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s
          --health-retries=5 --health-start-period=5s
      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Install system packages
        # prettier-ignore
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y file libpq-dev libvips-dev
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Prepare gem cache
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-
      - name: Prepare Bun cache
        uses: actions/cache@v6
        with:
          path: vendor/bun
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Set up tools
        uses: jdx/mise-action@v3
        with:
          install_args: ruby bun
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ruby gems
        run: bundle install
      - name: Install Bun packages
        run: bun install
      - name: Install Playwright browsers
        run: bun run playwright install --only-shell --with-deps
      - name: Prepare database
        run: bin/rails db:test:prepare
      - id: runTests
        name: Run tests
        run: mise test:all -v
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure() && steps.runTests.outcome == 'failure'
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
