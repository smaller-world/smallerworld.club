# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy

# prettier-ignore
run-name: "Deploy from ${{ github.event.workflow_run.head_branch }} (${{ github.event.workflow_run.head_commit.message }})"

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy on Fly
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      queue: max
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy on Fly
        # prettier-ignore
        run: flyctl deploy --remote-only --ha=false --build-arg SENTRY_RELEASE="${{ github.event.workflow_run.head_sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.V2_FLY_API_TOKEN }}

  release:
    name: Release on Sentry
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up tooling
        uses: jdx/mise-action@v4
        with:
          install_args: bun
      - name: Install Bun packages
        run: bun install
      - name: Build source maps
        run: bun run build
        env:
          NODE_ENV: production
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: ./app/assets/builds/
          disable_telemetry: true
          ignore_missing: true
