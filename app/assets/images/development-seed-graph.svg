<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 900 710" role="img" aria-labelledby="title description">
<title id="title">seed baseline social graph</title>
<desc id="description">arrows run from a world to its key recipients. dashed arrows are pending invitations, which grant no access. blair and casey, and blair and ellis, share reciprocal keys. full scenario descriptions accompany this graph.</desc>
<style>
:root { color-scheme: light dark; --paper: Canvas; --ink: CanvasText; --muted: GrayText; --line: GrayText; }
text { fill: var(--ink); font-family: sans-serif; font-size: 17px; }
.small { fill: var(--muted); font-size: 13px; }
.node { fill: var(--paper); stroke: var(--line); }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arrow); }
.pending { stroke-dasharray: 6 4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<rect y="90" width="900" height="710" rx="16" fill="var(--paper)"/>

<rect class="node" x="24" y="115" width="215" height="64" rx="12"/><text x="36" y="141">alex&#x27;s world</text><text class="small" x="36" y="163">1 post · no friends</text>
<text class="small" x="268" y="152">no outgoing keys or invitations</text>
<rect class="node" x="24" y="227" width="215" height="64" rx="12"/><text x="36" y="253">blair&#x27;s world</text><text class="small" x="36" y="275">60 posts</text>
<path class="edge" d="M 239 259 H 252 V 213 H 343 V 227"/>
<rect class="node" x="274" y="227" width="139" height="64" rx="12"/><text x="284" y="253">alex</text><text class="small" x="284" y="275">journal entries only</text>
