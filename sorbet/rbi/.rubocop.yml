inherit_from: ../../.rubocop.yml

plugins:
  - rubocop-sorbet

AllCops:
  Exclude:
    - annotations/**/*
    - dsl/**/*
    - gems/**/*

Metrics/ParameterLists:
  Enabled: false

Naming/FileName:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
Style/OneClassPerFile:
  Enabled: false
