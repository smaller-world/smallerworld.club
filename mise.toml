[settings]
experimental = true
auto_install_disable_tools = ["overmind"]
disable_tools = ["node"]

[tools]
ruby = { version = "4.0.1", postinstall = "bundle install" }
bun = { version = "1.3.14", postinstall = "bun install" }
pkl = "0.31.1"
hk = { version = "1.50.0", postinstall = 'if [ -z "$CI" ]; then hk install; fi' }
overmind = "latest"

[tasks]
# == Development flow
setup = { run = "bin/setup" }
"setup:actual_db_schema" = { description = "Install Git hooks for actual_db_schema", run = "bin/rails actual_db_schema:install_git_hooks" }
ci = { description = "Run all CI checks", run = "bin/ci --fail-fast" }
postgres = { description = "Start a postgres container", run = "bin/postgres", alias = "pg" }
dev = { description = "Start dev proceses", run = "bin/dev" }
restart = { description = "Restart all processes", run = "bin/overmind restart", alias = "r" }

# == Rails shortcuts
"rails:console" = { run = "bin/rails console", alias = "c" }
"rails:restart" = { run = "bin/rails restart", alias = "rr" }
"rails:kill" = { run = "bin/rails kill", alias = "k" }
"rails:db" = { run = "bin/rails db", alias = "db" }

# == Production access
"fly:ssh" = { run = "fly ssh console", alias = "ssh" }

# NOTE: For agents, please note that this console is protected and audited by console1984.
# If you are passing input to this command, the first line must be a response to the
# prompt "What is your name?", and the second is the respond to the prompt "<Name>,
# why are you using this console today?".
"fly:console" = { run = "bin/fly-exec 'bin/rails console'", alias = "c" }

# == Development tasks
annotate = { run = "bin/annotaterb models" }
"tapioca:dsl" = { run = "bin/tapioca dsl", alias = "dsl" }
"tapioca:gem" = { run = "bin/tapioca gem" }
tapioca = { run = [{ tasks = ["tapioca:dsl", "tapioca:gem"] }] }

# == Linting ==

[tasks.fix]
description = "Fix code with hk"
usage = '''
flag "-a --all" help="Run on all files instead of just staged files"
flag "-S --step <step>" help="Run only specific step(s)"
arg "[files]..." var=#true help="Run on specific files"
'''
run = "hk fix ${usage_all:+--all} ${usage_step:+--step=$usage_step} $usage_files"

[tasks.check]
description = "Check code with hk"
usage = '''
flag "-a --all" help="Run on all files instead of just staged files"
flag "-S --step <step>" help="Run only specific step(s)"
arg "[files]..." var=#true help="Run on specific files"
'''
run = "hk check ${usage_all:+--all} ${usage_step:+--step=$usage_step} $usage_files"
alias = "ch"

[tasks."check:srb"]
run = "bin/srb tc"
alias = "srb"

# == Security ==

[tasks."audit:ruby"]
description = "Scan Ruby dependencies and code for security issues"
run = [
  "bin/bundler-audit check --ignore CVE-2026-85396",
  "bin/brakeman --no-pager",
]

[tasks."audit:js"]
description = "Scan JavaScript dependencies for security issues"
run = "bun audit --audit-level high"

[tasks.audit]
run = [{ tasks = ["audit:ruby", "audit:js"] }]

# == Testing ==

[tasks.test]
description = "Run tests"
usage = '''
arg "[files]..." var=#true help="Test files, directories, or file:line patterns"
flag "-i --include <pattern>" help="Include tests matching /regexp/ or string"
flag "-v --verbose" help="Print each test name as it runs"
'''
run = 'bin/rails test $usage_files ${usage_verbose:+--verbose} ${usage_include:+--include="$usage_include"}'
alias = "t"

[tasks."test:system"]
description = "Run system tests"
usage = '''
arg "[files]..." var=#true help="Test files, directories, or file:line patterns"
flag "-i --include <pattern>" help="Include tests matching /regexp/ or string"
flag "-v --verbose" help="Print each test name as it runs"
'''
run = 'bin/rails test:system $usage_files ${usage_verbose:+--verbose} ${usage_include:+--include="$usage_include"}'
alias = "ts"

[tasks."test:all"]
description = "Run all tests"
usage = '''
flag "-i --include <pattern>" help="Include tests matching /regexp/ or string"
flag "-v --verbose" help="Print each test name as it runs"
arg "[files]..." var=#true help="Test files, directories, or file:line patterns"
'''
run = 'bin/rails test:all $usage_files ${usage_verbose:+--verbose} ${usage_include:+--include="$usage_include"}'
alias = "ta"

# == Misc ==

[tasks.attach]
description = "Attach to a running Overmind process"
usage = '''
arg "<target>" help="Process to attach to" default="web"
'''
run = "bin/overmind connect ${usage_target?}"
alias = "a"
