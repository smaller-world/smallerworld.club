inherit_from: ../.rubocop.yml

Minitest/EmptyLineBeforeAssertionMethods:
  Enabled: false
Minitest/MultipleAssertions:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  AllowedMethods:
    - post
    - get
    - visit
    - raise
    - throw
    - assert
    - assert_nil
    - assert_not
    - assert_empty
    - assert_equal
    - assert_predicate
    - assert_raises
    - assert_no_difference
    - flunk
